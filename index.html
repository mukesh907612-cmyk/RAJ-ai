<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="RajAI - High-performance, multimodal AI workstation powered by Google Gemini." />
  <meta name="theme-color" content="#0d0f12" />
  <title>RajAI — Intelligent Assistant</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------------
       1. DESIGN SYSTEM & CSS VARIABLES
       ------------------------------------------------------------- */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Light Theme */
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-surface-subtle: #f8fafc;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --brand-primary: #4f46e5;
      --brand-primary-hover: #4338ca;
      --brand-surface: rgba(79, 70, 229, 0.08);
      --accent-danger: #ef4444;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --sidebar-width: 280px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --topbar-height: 56px;
      --composer-max-w: 840px;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-canvas: #090a0f;
      --bg-surface: #11131a;
      --bg-surface-elevated: #1a1d27;
      --bg-surface-subtle: #141720;
      --border-subtle: #232736;
      --border-strong: #333a4d;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --brand-primary: #6366f1;
      --brand-primary-hover: #4f46e5;
      --brand-surface: rgba(99, 102, 241, 0.12);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg-canvas: #090a0f;
        --bg-surface: #11131a;
        --bg-surface-elevated: #1a1d27;
        --bg-surface-subtle: #141720;
        --border-subtle: #232736;
        --border-strong: #333a4d;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-tertiary: #64748b;
        --brand-primary: #6366f1;
        --brand-primary-hover: #4f46e5;
        --brand-surface: rgba(99, 102, 241, 0.12);
      }
    }

    /* -------------------------------------------------------------
       2. BASE RESET & LAYOUT
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    button {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast), border var(--transition-fast), transform var(--transition-fast);
    }

    button:active {
      transform: scale(0.97);
    }

    svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* -------------------------------------------------------------
       3. APP SHELL ARCHITECTURE
       ------------------------------------------------------------- */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform var(--transition-normal);
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--brand-primary), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
    }

    .sidebar-actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-new-chat {
      background: var(--brand-surface);
      color: var(--brand-primary);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      gap: 8px;
      justify-content: flex-start;
      width: 100%;
    }

    .btn-new-chat:hover {
      background: var(--brand-primary);
      color: #fff;
    }

    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 12px 8px 34px;
      font-size: 0.85rem;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-tertiary);
    }

    .history-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      font-size: 0.88rem;
      position: relative;
    }

    .chat-item:hover, .chat-item.active {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .chat-item.active {
      font-weight: 500;
      border-left: 3px solid var(--brand-primary);
    }

    .chat-item-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .chat-item-actions {
      display: none;
      gap: 4px;
    }

    .chat-item:hover .chat-item-actions {
      display: flex;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--brand-primary);
    }

    /* Main Content */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg-canvas);
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .topbar {
      height: var(--topbar-height);
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
    }

    .btn-icon:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    /* -------------------------------------------------------------
       4. CONVERSATION CANVAS & MESSAGES
       ------------------------------------------------------------- */
    #chat-canvas {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 140px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .conversation-thread {
      max-width: var(--composer-max-w);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Welcome / Empty State */
    .welcome-container {
      margin: auto;
      max-width: 640px;
      text-align: center;
      padding: 40px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--brand-primary), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }

    .welcome-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .welcome-sub {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 440px;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 12px;
    }

    .suggestion-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: left;
      transition: all var(--transition-fast);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .suggestion-card:hover {
      border-color: var(--brand-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .suggestion-card h4 {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .suggestion-card p {
      font-size: 0.8rem;
      color: var(--text-tertiary);
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      gap: 16px;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 600;
      font-size: 13px;
    }

    .message-row.model .message-avatar {
      background: var(--brand-surface);
      color: var(--brand-primary);
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .message-content-wrapper {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .message-row.user .message-content-wrapper {
      align-items: flex-end;
    }

    .message-bubble {
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .message-row.user .message-bubble {
      background: var(--brand-primary);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.model .message-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
      width: 100%;
    }

    .message-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--transition-fast);
      margin-top: 2px;
    }

    .message-row:hover .message-actions {
      opacity: 1;
    }

    .action-btn-sm {
      padding: 4px;
      border-radius: var(--radius-sm);
      color: var(--text-tertiary);
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn-sm:hover {
      color: var(--text-primary);
      background: var(--bg-surface-elevated);
    }

    /* Markdown Rich Presentation */
    .message-bubble h1, .message-bubble h2, .message-bubble h3 {
      margin: 12px 0 6px;
      font-weight: 600;
      line-height: 1.3;
    }
    .message-bubble h1 { font-size: 1.35rem; }
    .message-bubble h2 { font-size: 1.2rem; }
    .message-bubble h3 { font-size: 1.05rem; }
    .message-bubble p { margin-bottom: 8px; }
    .message-bubble p:last-child { margin-bottom: 0; }
    .message-bubble ul, .message-bubble ol { margin: 6px 0 10px 20px; }
    .message-bubble li { margin-bottom: 3px; }
    .message-bubble blockquote {
      border-left: 3px solid var(--brand-primary);
      padding-left: 12px;
      color: var(--text-secondary);
      margin: 8px 0;
      font-style: italic;
    }
    .message-bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 10px 0;
      font-size: 0.88rem;
    }
    .message-bubble th, .message-bubble td {
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      text-align: left;
    }
    .message-bubble th {
      background: var(--bg-surface-elevated);
      font-weight: 600;
    }

    /* Code Blocks */
    .code-wrapper {
      background: #0d1117;
      border-radius: var(--radius-md);
      overflow: hidden;
      margin: 12px 0;
      border: 1px solid #30363d;
      color: #e6edf3;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: #161b22;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: #8b949e;
      border-bottom: 1px solid #30363d;
    }
    .code-copy-btn {
      color: #8b949e;
      font-size: 0.75rem;
      gap: 4px;
    }
    .code-copy-btn:hover { color: #f0f6fc; }
    .code-wrapper pre {
      padding: 12px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.85em;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* Attachments Preview inside Bubble */
    .bubble-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .bubble-attachment-item {
      max-width: 180px;
      max-height: 140px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .bubble-attachment-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Typing Pulse */
    .typing-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background-color: var(--brand-primary);
      margin-left: 4px;
      animation: blink 1s infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* -------------------------------------------------------------
       5. COMPOSER & FLOATING DOCK
       ------------------------------------------------------------- */
    #composer-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, var(--bg-canvas) 30%);
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .composer-inner {
      max-width: var(--composer-max-w);
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .composer-inner:focus-within {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 2px var(--brand-surface), var(--shadow-lg);
    }

    /* Previews Tray */
    .attachment-tray {
      display: flex;
      gap: 8px;
      padding: 6px 4px 10px;
      overflow-x: auto;
    }
    .attachment-tray:empty { display: none; }

    .attachment-chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .attachment-chip img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }
    .attachment-chip-remove {
      background: rgba(0,0,0,0.5);
      color: white;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
    }

    .composer-row-main {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #user-prompt-input {
      flex: 1;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      padding: 6px 4px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      line-height: 1.4;
      background: transparent;
      color: var(--text-primary);
    }

    .composer-actions-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
      margin-top: 4px;
    }

    .tools-dock {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      position: relative;
    }
    .tool-btn:hover {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
    }
    .tool-btn.active {
      color: var(--brand-primary);
      background: var(--brand-surface);
    }

    .btn-send {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--brand-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-send:hover { background: var(--brand-primary-
